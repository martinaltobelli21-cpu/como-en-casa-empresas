[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."weekly-reminder"]
  schedule = "0 13 * * 6"

[functions."thu-fri-reminder"]
  schedule = "0 14 * * 4,5"

[functions."deadline-autofill"]
  schedule = "0 17 * * 6"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
